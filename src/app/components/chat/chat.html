<div class="chat-widget">

  <!-- CHAT WINDOW -->
  @if (isOpen) {

    <div class="chat-window">

      <!-- HEADER -->
      <div class="chat-header">

        <div class="chat-title">
          <strong>Siva AI</strong>
          <span>Ask about my profile</span>
        </div>

        <button
          type="button"
          class="close-button"
          (click)="toggleChat()"
          aria-label="Close chat"
        >
          ×
        </button>

      </div>


      <!-- MESSAGES -->
      <div
        class="chat-messages"
        #messagesContainer
      >

        @for (msg of messages; track $index) {

          <div
            class="message-row"
            [class.user-row]="msg.role === 'user'"
            [class.ai-row]="msg.role === 'assistant'"
          >

            @if (msg.role === 'assistant') {
              <div class="avatar">
                AI
              </div>
            }

            <div
              class="message"
              [class.user-message]="msg.role === 'user'"
              [class.ai-message]="msg.role === 'assistant'"
            >
              {{ msg.content }}
            </div>

            @if (msg.role === 'user') {
              <div class="avatar user-avatar">
                You
              </div>
            }

          </div>

        }

      </div>


      <!-- INPUT -->
      <div class="chat-input">

        <input
          type="text"
          [(ngModel)]="message"
          placeholder="Ask me something..."
          (keyup.enter)="sendMessage()"
        />

        <button
          type="button"
          (click)="sendMessage()"
          [disabled]="!message.trim()"
        >
          Send
        </button>

      </div>

    </div>

  }


  <!-- FLOATING CHAT BUTTON -->
  @if (!isOpen) {

    <button
      type="button"
      class="chat-toggle"
      (click)="toggleChat()"
      aria-label="Open AI chat"
    >
      💬
    </button>

  }

</div>
